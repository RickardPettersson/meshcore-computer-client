# Runs the tests on every push to main and on pull requests. Failing tests show up as annotations
# (readable without signing in). Releases are built separately by release.yml when a v* tag is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        shell: pwsh
        run: ./build/test.ps1
